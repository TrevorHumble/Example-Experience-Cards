<!DOCTYPE html>
<!--
  ============================================================================
  GRID LINKS TEMPLATE
  ============================================================================
  A reusable card template for university dashboards. Displays links in a
  2×N grid where each cell is a bordered box with an icon and a short
  label. Use this pattern when the card hosts several short, parallel
  destinations (e.g., "Parking Map", "Printable Map", "Accessibility Map").

  Works best with 4 links (2×2) or 6 links (2×3). Odd counts leave an
  empty cell.

  For single-column list layouts, use the Simple Rows or Descriptive Rows
  templates instead.

  DESIGNED FOR: iframe embedding in a portal framework (e.g., Anthology).
  The grid cells flex-fill available vertical space.

  ACCESSIBILITY: Audited against WCAG 2.2 AA. See inline comments for
  specific notes on alt text, focus styles, icon semantics, and the
  "opens in new tab" pattern.
  ============================================================================
-->
<html lang="en">
<!--
  ^^ LANGUAGE: Update the lang attribute if this template is used for a
  non-English-speaking institution. Screen readers use this to select
  pronunciation. Required for WCAG 3.1.1.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Title</title>
  <!--
    TITLE: Replace "Card Title" above with the service name. The parent
    portal framework typically displays the card title separately in its
    chrome, but this <title> is still read by screen readers when the
    iframe receives focus.
  -->

  <!-- ============================================================
       FONTS — Public Sans for all label text.
       Swap if your institution has brand-mandated typography.
       ============================================================ -->
  <link
    href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500&display=swap"
    rel="stylesheet"
  />

  <!-- ============================================================
       MATERIAL ICONS — Google's open-source icon set.
       See icon names at https://fonts.google.com/icons
       ============================================================ -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
  />

  <style>
    /* --------------------------------------------------------------
       RESET + BASE LAYOUT
       -------------------------------------------------------------- */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Public Sans', sans-serif;
      background-color: white;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* --------------------------------------------------------------
       BANNER IMAGE
       Fills width, capped at 130px tall. object-fit: cover avoids
       distortion on wide/narrow aspect ratios.
       -------------------------------------------------------------- */
    header img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 130px;
      object-fit: cover;
    }

    /* --------------------------------------------------------------
       GRID CONTAINER
       2 equal columns, rows auto-generated from content. Each cell
       flex-grows equally (grid-auto-rows: 1fr).
       -------------------------------------------------------------- */
    .card-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: 1fr;
      gap: 0.4rem;
      padding: 0.4rem;
      box-sizing: border-box;
      min-height: 0;
    }

    /* --------------------------------------------------------------
       GRID CELL LINK
       Bordered, rounded box holding an icon + label.
       -------------------------------------------------------------- */
    .card-link {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: #333; /* 12.6:1 on white — passes WCAG AAA */
      background-color: white;
      padding: 0.5rem;
      /* Extra right padding reserves space for the external-link icon
         in the top-right corner, so wrapping labels don't flow under it */
      padding-right: 1.25rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
      height: 100%;
      position: relative; /* Needed for absolutely-positioned external icon */
    }

    /* --------------------------------------------------------------
       HOVER STATE
       Note: this template uses #f0f0f0 for grid-cell hover. The
       Simple/Descriptive Rows templates use #f5f5f5. If your institution
       wants a single hover color across all card patterns, update here.
       -------------------------------------------------------------- */
    .card-link:hover {
      background-color: #f0f0f0;
    }

    /* --------------------------------------------------------------
       FOCUS STYLE — keyboard users must see where focus is.
       2px outline meets WCAG 2.2 focus visibility expectations.
       -------------------------------------------------------------- */
    .card-link:focus {
      outline: 2px solid #000;
      outline-offset: 1px;
    }

    .card-link:focus:not(:focus-visible) {
      outline: none;
    }

    .card-link:focus-visible {
      outline: 2px solid #000;
      outline-offset: 1px;
    }

    /* --------------------------------------------------------------
       ICON
       Color #5A5A5A passes 7:1 contrast on white (WCAG AAA).
       -------------------------------------------------------------- */
    .card-icon {
      font-size: 35px;
      flex-shrink: 0;
      color: #5A5A5A;
    }

    .card-link:hover .card-icon {
      color: black;
    }

    /* --------------------------------------------------------------
       LINK TEXT
       Wraps on long labels. line-height: 1.2 keeps wrapped labels
       readable without overflowing cell height.
       -------------------------------------------------------------- */
    .link-text {
      font-weight: 500;
      line-height: 1.2;
      word-break: break-word;
      white-space: normal;
      flex: 1;
    }

    /* --------------------------------------------------------------
       EXTERNAL LINK INDICATOR
       Positioned in the top-right corner of each grid cell.
       Small enough not to crowd the label; visible enough to signal
       the new-tab behavior per WCAG 3.2.5.
       -------------------------------------------------------------- */
    .external-icon {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 14px !important;
      color: #5B5E65; /* 6.3:1 on white — passes WCAG AA */
    }

    /* --------------------------------------------------------------
       RESPONSIVE TEXT
       Shrinks the label font on narrower iframe widths so longer
       labels still fit within a single grid cell.
       -------------------------------------------------------------- */
    @media (max-width: 329px) {
      .link-text {
        font-size: 14px;
      }
    }

    @media (max-width: 308px) {
      .link-text {
        font-size: 12px;
      }
    }

    /* --------------------------------------------------------------
       VISUALLY-HIDDEN UTILITY
       For screen-reader-only text (e.g., "(opens in new tab)").
       -------------------------------------------------------------- */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <!--
    MAIN LANDMARK: wraps all interactive content so screen reader users
    can jump straight to the card body via landmark navigation.
  -->
  <main>
    <div class="card">

      <!--
        ========================================================
        BANNER IMAGE
        ========================================================
        REPLACE THE src BELOW with your institution's banner image URL.
        Recommended dimensions: ~800×130px, SVG or optimized PNG/JPG.

        ALT TEXT: Left empty (alt="") because this banner is decorative —
        the card title and grid labels already convey the service's
        purpose. Empty alt lets screen readers skip the image rather than
        announcing redundant information. WCAG 1.1.1, technique H67.

        If your banner image CONTAINS text or conveys information not
        available elsewhere on the card, replace alt="" with a descriptive
        alternative.
      -->
      <header>
        <img src="REPLACE-WITH-BANNER-URL.svg" alt="" />
      </header>

      <!--
        ========================================================
        GRID OF LINKS
        ========================================================
        Each <a class="card-link"> is one grid cell. Add or remove cells
        to change the grid size. The grid auto-fills left-to-right,
        top-to-bottom.

        FOR EACH CELL, CUSTOMIZE:
          1. href="..."             → Destination URL
          2. <span> icon name       → Material Icon ligature
                                       Browse: https://fonts.google.com/icons
          3. link-text content      → Short label (2–4 words ideal)

        RECOMMENDED CELL COUNT:
          • 4 cells (2×2) — ideal balance of room and density
          • 6 cells (2×3) — works well if labels are short
          • Odd counts leave an empty trailing cell

        target="_blank" vs. same-tab:
          Use target="_blank" for EXTERNAL systems (different domain).
          If the link stays in the parent portal, remove target="_blank"
          AND rel="noopener noreferrer" AND the external-icon and sr-only
          spans.

        rel="noopener noreferrer":
          Required whenever target="_blank" is used. Security + privacy.

        aria-hidden="true" on icons:
          Material Icons ligatures are decorative — the text next to them
          is what actually labels the link. Hiding icons from screen
          readers prevents raw ligature names being read aloud.
      -->
      <div class="card-content">

        <!-- ============ CELL 1 ============ -->
        <a
          class="card-link"
          href="REPLACE-WITH-URL-1"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="material-icons card-icon" aria-hidden="true">local_parking</span>
          <span class="link-text">First Label</span>
          <span class="material-icons external-icon" aria-hidden="true">open_in_new</span>
          <span class="sr-only">(opens in new tab)</span>
        </a>

        <!-- ============ CELL 2 ============ -->
        <a
          class="card-link"
          href="REPLACE-WITH-URL-2"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="material-icons card-icon" aria-hidden="true">accessible</span>
          <span class="link-text">Second Label</span>
          <span class="material-icons external-icon" aria-hidden="true">open_in_new</span>
          <span class="sr-only">(opens in new tab)</span>
        </a>

        <!-- ============ CELL 3 ============ -->
        <a
          class="card-link"
          href="REPLACE-WITH-URL-3"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="material-icons card-icon" aria-hidden="true">map</span>
          <span class="link-text">Third Label</span>
          <span class="material-icons external-icon" aria-hidden="true">open_in_new</span>
          <span class="sr-only">(opens in new tab)</span>
        </a>

        <!-- ============ CELL 4 ============ -->
        <a
          class="card-link"
          href="REPLACE-WITH-URL-4"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="material-icons card-icon" aria-hidden="true">print</span>
          <span class="link-text">Fourth Label</span>
          <span class="material-icons external-icon" aria-hidden="true">open_in_new</span>
          <span class="sr-only">(opens in new tab)</span>
        </a>

      </div>
    </div>
  </main>
</body>
</html>
